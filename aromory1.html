    <script>
        // ===== GUNFIRE CANVAS ANIMATION =====
        const gunCanvas = document.getElementById('gunfire-canvas');
        const gunCtx = gunCanvas.getContext('2d');
        let gunW, gunH;
        let muzzleFlashes = [];
        let bulletTrails = [];
        let casings = [];

        function resizeGun() {
            gunW = gunCanvas.width = window.innerWidth;
            gunH = gunCanvas.height = window.innerHeight;
        }
        resizeGun();
        window.addEventListener('resize', resizeGun);

        class MuzzleFlash {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.life = 1;
                this.decay = 0.08 + Math.random() * 0.05;
                this.size = 80 + Math.random() * 120;
                this.hue = 30 + Math.random() * 30;
                this.sparks = [];
                for (let i = 0; i < 15; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 15 + 5;
                    this.sparks.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        size: Math.random() * 4 + 2
                    });
                }
            }
            update() {
                this.life -= this.decay;
                this.sparks.forEach(s => {
                    s.x += s.vx; s.y += s.vy;
                    s.vx *= 0.95; s.vy *= 0.95;
                    s.life -= 0.04;
                });
            }
            draw() {
                // Main flash
                const grad = gunCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.life * 0.9})`);
                grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 60%, ${this.life * 0.6})`);
                grad.addColorStop(0.6, `hsla(${this.hue}, 100%, 40%, ${this.life * 0.3})`);
                grad.addColorStop(1, 'transparent');
                gunCtx.fillStyle = grad;
                gunCtx.beginPath();
                gunCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                gunCtx.fill();

                // Core bright spot
                gunCtx.fillStyle = `hsla(${this.hue + 20}, 100%, 95%, ${this.life})`;
                gunCtx.beginPath();
                gunCtx.arc(this.x, this.y, this.size * 0.15, 0, Math.PI * 2);
                gunCtx.fill();

                // Sparks
                this.sparks.forEach(s => {
                    if (s.life <= 0) return;
                    gunCtx.save();
                    gunCtx.globalAlpha = s.life;
                    gunCtx.fillStyle = '#ffcc00';
                    gunCtx.shadowColor = '#ff6600';
                    gunCtx.shadowBlur = 15;
                    gunCtx.beginPath();
                    gunCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    gunCtx.fill();
                    // Trail
                    gunCtx.strokeStyle = `hsla(${this.hue}, 100%, 60%, ${s.life * 0.5})`;
                    gunCtx.lineWidth = s.size * 0.5;
                    gunCtx.beginPath();
                    gunCtx.moveTo(s.x, s.y);
                    gunCtx.lineTo(s.x - s.vx * 3, s.y - s.vy * 3);
                    gunCtx.stroke();
                    gunCtx.restore();
                });
            }
        }

        class BulletTrail {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = 25 + Math.random() * 15;
                this.vy = (Math.random() - 0.5) * 3;
                this.life = 1;
                this.trail = [];
            }
            update() {
                this.trail.push({x: this.x, y: this.y, alpha: 1});
                if (this.trail.length > 20) this.trail.shift();
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.02;
                this.trail.forEach(t => t.alpha *= 0.9);
            }
            draw() {
                if (this.life <= 0) return;
                // Bullet head
                gunCtx.save();
                gunCtx.globalAlpha = this.life;
                gunCtx.fillStyle = '#fff';
                gunCtx.shadowColor = '#ffaa33';
                gunCtx.shadowBlur = 20;
                gunCtx.beginPath();
                gunCtx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                gunCtx.fill();
                // Trail
                gunCtx.beginPath();
                gunCtx.moveTo(this.x, this.y);
                for (let i = this.trail.length - 1; i >= 0; i--) {
                    const t = this.trail[i];
                    gunCtx.lineTo(t.x, t.y);
                }
                gunCtx.strokeStyle = `rgba(255, 180, 50, ${this.life * 0.6})`;
                gunCtx.lineWidth = 2;
                gunCtx.stroke();
                gunCtx.restore();
            }
        }

        function createGunshot() {
            const x = gunW * 0.3 + Math.random() * gunW * 0.4;
            const y = gunH * 0.3 + Math.random() * gunH * 0.4;
            muzzleFlashes.push(new MuzzleFlash(x, y));
            bulletTrails.push(new BulletTrail(x + 20, y));
        }

        // Auto gunfire
        setInterval(() => {
            if (Math.random() > 0.3) createGunshot();
        }, 200);

        // Click to fire
        gunCanvas.addEventListener('click', (e) => {
            muzzleFlashes.push(new MuzzleFlash(e.clientX, e.clientY));
            bulletTrails.push(new BulletTrail(e.clientX + 20, e.clientY));
        });

        function animateGunfire() {
            gunCtx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            gunCtx.fillRect(0, 0, gunW, gunH);

            muzzleFlashes = muzzleFlashes.filter(mf => {
                mf.update(); mf.draw();
                return mf.life > 0;
            });

            bulletTrails = bulletTrails.filter(bt => {
                bt.update(); bt.draw();
                return bt.life > 0 && bt.x < gunW + 100;
            });

            requestAnimationFrame(animateGunfire);
        }
        animateGunfire();

        const PER_PAGE = 9;
        let currentCat = 'pistol';
        let currentPage = 1;

        const filterBar = document.getElementById('filterBar');
        const filterCount = document.getElementById('filterCount');
        const categoryTitle = document.getElementById('categoryTitle');
        const productGrid = document.getElementById('productGrid');
        const paginationEl = document.getElementById('pagination');

        function buildFilterBar() {
            filterBar.innerHTML = categories.map((cat, i) => `
                <button class="filter-btn ${cat.key === currentCat ? 'active' : ''}" data-key="${cat.key}">
                    ${cat.title} (${cat.items.length})
                </button>
            `).join('');
        }

        function renderPage() {
            const cat = categories.find(c => c.key === currentCat);
            const totalPages = Math.max(1, Math.ceil(cat.items.length / PER_PAGE));
            currentPage = Math.min(Math.max(1, currentPage), totalPages);

            categoryTitle.textContent = cat.title;
            filterCount.textContent = `Showing ${Math.min((currentPage - 1) * PER_PAGE + 1, cat.items.length)}-${Math.min(currentPage * PER_PAGE, cat.items.length)} of ${cat.items.length} items`;

            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = cat.items.slice(start, start + PER_PAGE);

            productGrid.innerHTML = pageItems.map(p => `
                <div class="product-card">
                    <div class="product-img-wrap">
                        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.opacity=0.15">
                    </div>
                    <div class="product-info">
                        <div class="product-code">${p.code}</div>
                        <div class="product-name">${p.name}</div>
                    </div>
                </div>
            `).join('');

            let pagHtml = `<button class="page-btn" id="prevBtn" ${currentPage === 1 ? 'disabled' : ''}>&larr;</button>`;
            const maxButtons = 7;
            let startP = Math.max(1, currentPage - 3);
            let endP = Math.min(totalPages, startP + maxButtons - 1);
            startP = Math.max(1, endP - maxButtons + 1);

            if (startP > 1) {
                pagHtml += `<button class="page-btn" data-page="1">1</button>`;
                if (startP > 2) pagHtml += `<span style="color:#555;padding:0 4px;">...</span>`;
            }
            for (let p = startP; p <= endP; p++) {
                pagHtml += `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
            }
            if (endP < totalPages) {
                if (endP < totalPages - 1) pagHtml += `<span style="color:#555;padding:0 4px;">...</span>`;
                pagHtml += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
            }
            pagHtml += `<button class="page-btn" id="nextBtn" ${currentPage === totalPages ? 'disabled' : ''}>&rarr;</button>`;
            paginationEl.innerHTML = pagHtml;

            document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderPage();
                    document.getElementById('categoryTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); } });
            if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; renderPage(); } });
        }

        filterBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            currentCat = btn.dataset.key;
            currentPage = 1;
            buildFilterBar();
            renderPage();
        });

        buildFilterBar();
        renderPage();

        // Gunfire video background - no canvas animation needed
        function scrollToProducts(e) {
            e.preventDefault();
            const btn = e.target;
            const rect = btn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                ember.style.left = centerX + 'px';
                ember.style.top = centerY + 'px';
                ember.style.setProperty('--ex', (Math.random() - 0.5) * 300 + 'px');
                ember.style.setProperty('--ey', -Math.random() * 300 - 50 + 'px');
                document.body.appendChild(ember);
                setTimeout(() => ember.remove(), 3000);
            }

            document.getElementById('products').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
